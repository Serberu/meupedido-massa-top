
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MeuPedido - Massa Top</title>
<style>
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  padding: 16px;
  font-family: Arial, sans-serif;
  background: #f4f4f4;
  color: #222;
}
header {
  background: #d92323;
  color: white;
  padding: 20px;
  text-align: center;
  border-radius: 12px;
  margin-bottom: 16px;
}
h1 {
  margin: 0 0 6px;
}
section {
  background: white;
  padding: 16px;
  margin-bottom: 16px;
  border-radius: 12px;
  box-shadow: 0 2px 6px #00000012;
}
h2 {
  margin-top: 0;
  color: #d92323;
}
label {
  display: block;
  font-weight: bold;
  margin: 12px 0 5px;
}
input, select, textarea, button {
  width: 100%;
  padding: 12px;
  font-size: 16px;
  border-radius: 8px;
  border: 1px solid #ccc;
}
button {
  background: #d92323;
  color: white;
  border: none;
  font-weight: bold;
  cursor: pointer;
  margin-top: 10px;
}
button.secondary {
  background: #333;
}
.item {
  padding: 10px;
  border-bottom: 1px solid #ddd;
}
.total {
  font-size: 22px;
  font-weight: bold;
  margin-top: 15px;
}
.small {
  font-size: 13px;
  color: #666;
}
</style>
</head>
<body>

<header>
  <h1>🍕 MeuPedido</h1>
  <div>Massa Top</div>
</header>

<section>
  <h2>Novo pedido</h2>

  <label for="customer">Nome do cliente</label>
  <input id="customer" placeholder="Nome do cliente">

  <label for="phone">Telefone</label>
  <input id="phone" placeholder="Telefone">

  <label for="product">Produto</label>
  <input id="product" placeholder="Ex.: Pizza calabresa">

  <label for="price">Preço do produto (R$)</label>
  <input id="price" type="number" min="0" step="0.50" value="0">

  <label for="quantity">Quantidade</label>
  <input id="quantity" type="number" min="1" value="1">

  <label for="orderBorder">Borda da pizza</label>
  <select id="orderBorder">
    <option value="0">Sem borda</option>
    <option value="0">Catupiry — grátis</option>
    <option value="0">Cheddar — grátis</option>
    <option value="0">Chocolate — grátis</option>
  </select>

  <label for="borderPrice">Preço da borda (R$)</label>
  <input id="borderPrice" type="number" min="0" step="0.50" value="0">

  <label for="extraName">Adicional</label>
  <input id="extraName" placeholder="Ex.: bacon, queijo extra">

  <label for="extraPrice">Preço do adicional (R$)</label>
  <input id="extraPrice" type="number" min="0" step="0.50" value="0">

  <label for="deliveryFee">Taxa de entrega (R$)</label>
  <input id="deliveryFee" type="number" min="0" step="0.50" value="0">

  <label for="courierPay">Pagamento do entregador (R$)</label>
  <input id="courierPay" type="number" min="0" step="0.50" value="0">

  <label for="notes">Observações</label>
  <textarea id="notes" placeholder="Endereço e detalhes do pedido"></textarea>

  <div class="total">Total: <span id="total">R$ 0,00</span></div>

  <button id="saveOrder">Salvar pedido</button>
  <button id="clearForm" class="secondary">Limpar formulário</button>
</section>

<section>
  <h2>Pedidos registrados</h2>
  <div id="orders"></div>
</section>

<script>
const $ = id => document.getElementById(id);
const dinheiro = valor => Number(valor || 0).toLocaleString('pt-BR', {
  style: 'currency',
  currency: 'BRL'
});

const CHAVE = 'meupedido_massa_top_v2';
let pedidos = [];

try {
  pedidos = JSON.parse(localStorage.getItem(CHAVE)) || [];
} catch (e) {
  pedidos = [];
}

function calcularTotal() {
  const preco = Math.max(0, Number($('price').value) || 0);
  const quantidade = Math.max(1, Number($('quantity').value) || 1);
  const borda = Math.max(0, Number($('borderPrice').value) || 0);
  const adicional = Math.max(0, Number($('extraPrice').value) || 0);
  const entrega = Math.max(0, Number($('deliveryFee').value) || 0);

  const total = preco * quantidade + borda + adicional + entrega;
  $('total').textContent = dinheiro(total);
  return total;
}

['price', 'quantity', 'borderPrice', 'extraPrice', 'deliveryFee']
  .forEach(id => $(id).addEventListener('input', calcularTotal));

function salvarPedidos() {
  localStorage.setItem(CHAVE, JSON.stringify(pedidos));
}

function mostrarPedidos() {
  const area = $('orders');
  area.replaceChildren();

  if (!pedidos.length) {
    area.textContent = 'Nenhum pedido registrado ainda.';
    return;
  }

  [...pedidos].reverse().forEach(pedido => {
    const item = document.createElement('div');
    item.className = 'item';

    const titulo = document.createElement('strong');
    titulo.textContent = pedido.cliente || 'Cliente sem nome';
    item.appendChild(titulo);

    const detalhes = document.createElement('p');
    detalhes.textContent =
      pedido.produto + ' × ' + pedido.quantidade +
      ' — ' + dinheiro(pedido.total);
    item.appendChild(detalhes);

    const telefone = document.createElement('p');
    telefone.textContent = 'Telefone: ' + (pedido.telefone || 'Não informado');
    item.appendChild(telefone);

    const observacao = document.createElement('p');
    observacao.textContent = pedido.observacoes || '';
    item.appendChild(observacao);

    const status = document.createElement('p');
    status.textContent = 'Status: ' + pedido.status;
    item.appendChild(status);

    const concluir = document.createElement('button');
    concluir.textContent = 'Marcar como entregue';
    concluir.addEventListener('click', () => {
      pedido.status = 'Entregue';
      salvarPedidos();
      mostrarPedidos();
    });
    item.appendChild(concluir);

    const excluir = document.createElement('button');
    excluir.textContent = 'Excluir pedido';
    excluir.className = 'secondary';
    excluir.addEventListener('click', () => {
      if (confirm('Deseja realmente excluir este pedido?')) {
        pedidos = pedidos.filter(p => p.id !== pedido.id);
        salvarPedidos();
        mostrarPedidos();
      }
    });
    item.appendChild(excluir);

    area.appendChild(item);
  });
}

$('saveOrder').addEventListener('click', () => {
  const produto = $('product').value.trim();
  const preco = Number($('price').value) || 0;
  const quantidade = Math.max(1, Number($('quantity').value) || 1);

  if (!produto) {
    alert('Digite o nome do produto.');
    $('product').focus();
    return;
  }

  if (preco < 0) {
    alert('O preço não pode ser negativo.');
    return;
  }

  const total = calcularTotal();

  const pedido = {
    id: Date.now().toString() + Math.random().toString(36).slice(2),
    cliente: $('customer').value.trim(),
    telefone: $('phone').value.trim(),
    produto,
    quantidade,
    borda: $('orderBorder').selectedOptions[0].text,
    precoBorda: Number($('borderPrice').value) || 0,
    adicional: $('extraName').value.trim(),
    precoAdicional: Number($('extraPrice').value) || 0,
    taxaEntrega: Number($('deliveryFee').value) || 0,
    pagamentoEntregador: Number($('courierPay').value) || 0,
    observacoes: $('notes').value.trim(),
    total,
    status: 'Recebido',
    data: new Date().toLocaleString('pt-BR')
  };

  pedidos.push(pedido);
  salvarPedidos();
  mostrarPedidos();

  alert('Pedido salvo com sucesso!');

  ['customer', 'phone', 'product', 'notes', 'extraName']
    .forEach(id => $(id).value = '');

  $('price').value = '0';
  $('quantity').value = '1';
  $('borderPrice').value = '0';
  $('extraPrice').value = '0';
  $('deliveryFee').value = '0';
  $('courierPay').value = '0';
  $('orderBorder').selectedIndex = 0;

  calcularTotal();
});

$('clearForm').addEventListener('click', () => {
  if (confirm('Deseja limpar os campos do formulário?')) {
    ['customer', 'phone', 'product', 'notes', 'extraName']
      .forEach(id => $(id).value = '');

    $('price').value = '0';
    $('quantity').value = '1';
    $('borderPrice').value = '0';
    $('extraPrice').value = '0';
    $('deliveryFee').value = '0';
    $('courierPay').value = '0';
    $('orderBorder').selectedIndex = 0;

    calcularTotal();
  }
});

calcularTotal();
mostrarPedidos();
</script>
</body>
</html>
